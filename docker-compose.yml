services:

  postgres:
    image: postgres:17-alpine

    container_name: shortly-postgres

    restart: unless-stopped

    environment:
      POSTGRES_USER: shortly
      POSTGRES_PASSWORD: shortly_password
      POSTGRES_DB: shortly

    ports:
      - "5434:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U shortly -d shortly"
        ]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: shortly-api

    restart: unless-stopped

    environment:
      NODE_ENV: development
      HOST: 0.0.0.0
      PORT: 3000
      DATABASE_URL: postgresql://shortly:shortly_password@postgres:5432/shortly
      LOG_LEVEL: info

    ports:
      - "3000:3000"

    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data: