services:

  postgres:
    image: postgres:17-alpine

    container_name: shortly-postgres

    restart: unless-stopped

    environment:
      POSTGRES_USER: shortly
      POSTGRES_PASSWORD: shortly_password
      POSTGRES_DB: shortly

    ports:
      - "5434:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U shortly -d shortly"
        ]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: